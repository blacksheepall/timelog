syntax = "proto3";

package timelog.v1;

option go_package = "github.com/blacksheepaul/timelog/gen/go/timelog/v1;timelogv1";

message Metric {
  int32 id = 1;
  string name = 2;
  string description = 3;
  string metric_type = 4;
  string unit = 5;
  optional double current_value = 6;
  optional string last_recorded_at = 7;
  optional string extra = 8;
  string created_at = 9;
  string updated_at = 10;
}

message MetricRecord {
  int32 id = 1;
  int32 metric_id = 2;
  double value = 3;
  optional string source = 4;
  optional string recorded_at = 5;
  string created_at = 6;
}

message CreateMetricRequest {
  string name = 1;
  string description = 2;
  string metric_type = 3;
  string unit = 4;
  optional string extra = 5;
}

message UpdateMetricRequest {
  int32 id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string metric_type = 4;
  optional string unit = 5;
  optional string extra = 6;
}

message ListMetricsRequest {}

message GetMetricRequest {
  int32 id = 1;
}

message DeleteMetricRequest {
  int32 id = 1;
}

message ListMetricRecordsRequest {
  int32 metric_id = 1;
}
