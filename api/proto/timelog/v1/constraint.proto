syntax = "proto3";

package timelog.v1;

option go_package = "github.com/blacksheepaul/timelog/gen/go/timelog/v1;timelogv1";

message Constraint {
  int32 id = 1;
  string description = 2;
  optional string end_reason = 3;
  string punishment_quote = 4;
  string start_date = 5;
  optional string end_date = 6;
  bool is_active = 7;
  string created_at = 8;
  string updated_at = 9;
  optional int32 metric_id = 10;
  optional string metric_operator = 11;
  optional double metric_target_value = 12;
}

message CreateConstraintRequest {
  string description = 1;
  string punishment_quote = 2;
  string start_date = 3;
  optional string end_date = 4;
  optional int32 metric_id = 5;
  optional string metric_operator = 6;
  optional double metric_target_value = 7;
}

message UpdateConstraintRequest {
  optional string description = 1;
  optional string punishment_quote = 2;
  optional string start_date = 3;
  optional string end_date = 4;
  optional int32 metric_id = 5;
  optional string metric_operator = 6;
  optional double metric_target_value = 7;
}

message ListConstraintsQuery {
  optional bool active = 1;
}

message CompleteConstraintRequest {
  string end_reason = 1;
}

message EvaluateConstraintRequest {
  int32 id = 1;
}

message ConstraintEvaluation {
  int32 constraint_id = 1;
  bool passed = 2;
  double actual = 3;
  double target = 4;
  string operator = 5;
}
