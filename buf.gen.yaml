version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/community/stephenh-ts-proto
    out: web/src/gen/api
    opt:
      - onlyTypes=true
      - snakeToCamel=false
      - useOptionals=none
      - esModuleInterop=true
