version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/community/stephenh-ts-proto
    out: web/src/gen/api
    opt:
      - onlyTypes=true
      - snakeToCamel=false
      - useOptionals=none
      - esModuleInterop=true
  - local: protoc-gen-jsonschema
    out: gen/openapi/schemas
    opt:
      - file_extension=gen.schema.json
      - disallow_additional_properties=false
    strategy: all
