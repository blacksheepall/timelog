dev_mode: false
app:
  timezone: 'Asia/Singapore' # Application timezone for date boundaries and display
database:
  host: ./dev.db
server:
  addr: '127.0.0.1'
  port: 8080
  allow_origins:
    - '*'
log:
  level: debug
  path: ./app.log
  rotation:
    max_size: 10
    max_backups: 3
    max_age: 7
  orm_log_level: 4 # 1=silent, 2=error, 3=warn, 4=info
passkey:
  enabled: false
  rp_id: 'timelog.local'
  rp_name: 'TimeLog'
  # RP origins must match the origin the browser sees. When running behind a
  # reverse proxy that terminates TLS, list the public HTTPS origin(s) here
  # (e.g. 'https://timelog.example.com'). For local Vite development on
  # localhost, 'http://localhost:5173' is also a valid secure context.
  rp_origins: []
  token_ttl: 86400
  temp_password:
    ttl: 900
test:
  flush: false
datasources:
  - name: maimemo
    type: maimemo
    enabled: true
    config:
      token: ""                     # Authorization: Bearer <token>
      endpoint: "https://open.maimemo.com"
mcp:
  enabled: false
  level: 'debug'
  path: './logs/mcp.log'
  transport: 'stdio' # stdio|http
  listen_addr: ':8080'
  token: '' # Authorization: Bearer <token>
