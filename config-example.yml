database:
  host: ./dev.db
server:
  addr: '127.0.0.1'
  port: 8080
  allow_origins:
    - '*'
  https_enabled: true
  cert_file: ./certs/cert.pem
  key_file: ./certs/key.pem
log:
  level: debug
  path: ./app.log
  rotation:
    max_size: 10
    max_backups: 3
    max_age: 7
  orm_log_level: 4 # 1=silent, 2=error, 3=warn, 4=info
passkey:
  enabled: false
  rp_id: 'localhost'
  rp_name: 'TimeLog'
  rp_origins:
    - 'http://localhost:3000'
    - 'http://localhost:8083'
  token_ttl: 86400
  temp_password:
    ttl: 900
test:
  flush: false
mcp:
  enabled: false
  level: 'debug'
  path: './logs/mcp.log'
  transport: 'stdio' # stdio|http
  listen_addr: ':8080'
  token: '' # Authorization: Bearer <token>
